
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover" />
    <meta name="theme-color" content="#16171D" />
    
    <!-- FOUC Prevention Script —
         Reads saved preference or falls back to OS prefers-color-scheme.
         Runs synchronously before any paint to prevent flash. -->
    <script>
      (function() {
        var saved = localStorage.getItem('theme_preference');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = (saved === 'light' || saved === 'dark') ? saved : (prefersDark ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
        // Update browser chrome color to match
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'light' ? '#F5F5F7' : '#16171D');
      })();
    </script>
    
    <!-- PWA / iOS Meta -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="KILANI Reporter" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <!-- Icons -->
    <link rel="icon" type="image/jpeg" href="/brand-logo.jpg" />
    <link rel="apple-touch-icon" href="/brand-logo.jpg" />
    
    <link rel="manifest" href="/manifest.json" />

    <title>KILANI Diamond Reporter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
    
    <style>
      :root {
        --sat: env(safe-area-inset-top);
        --sab: env(safe-area-inset-bottom);
        --sal: env(safe-area-inset-left);
        --sar: env(safe-area-inset-right);
      }

      body {
        -webkit-font-smoothing: antialiased;
        background-color: transparent;
        font-family: 'Poppins', sans-serif;
        color: #e4e4e7;
        overflow: hidden; /* Prevent body scroll, handle in root */
        overscroll-behavior-y: none; /* Prevent iOS bounce */
        /* Support safe areas for background color */
        padding-top: var(--sat);
        padding-bottom: var(--sab);
        padding-left: var(--sal);
        padding-right: var(--sar);
      }
      
      .tabular-nums { font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
      
      /* Dark Textured Background with Smoke */
      .app-background {
        position: fixed;
        inset: 0;
        z-index: -1;
        background-color: #020202;
        background-image: 
          url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.2' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
        background-size: 100px 100px;
        overflow: hidden;
        transition: background-color 0.3s;
      }

      .smoke-base {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 15vh;
        background: linear-gradient(to top, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.01) 80%, transparent 100%);
        filter: blur(8px);
        pointer-events: none;
        transition: background 0.3s;
      }

      .smoke-cloud {
        position: absolute;
        border-radius: 50%;
        filter: blur(20px);
        pointer-events: none;
        background: rgba(255, 255, 255, 0.12);
        transition: background 0.3s;
      }

      .smoke-1 { width: 30vw; height: 15vh; bottom: -5vh; left: -5vw; opacity: 0.7; }
      .smoke-2 { width: 40vw; height: 18vh; bottom: -8vh; right: -5vw; opacity: 0.6; }
      .smoke-3 { width: 25vw; height: 12vh; bottom: -2vh; left: 25vw; opacity: 0.5; filter: blur(25px); }
      .smoke-4 { width: 20vw; height: 10vh; bottom: 1vh; right: 20vw; opacity: 0.4; filter: blur(30px); }
      .smoke-5 { width: 35vw; height: 14vh; bottom: -4vh; left: 45vw; opacity: 0.6; filter: blur(22px); }

      /* Light Mode Background Overrides — no media query, uses data-theme */
      [data-theme="light"] .app-background {
        background-color: #F5F5F7;
        background-image: none;
      }
      [data-theme="light"] .smoke-cloud {
        background: rgba(197, 160, 89, 0.04);
        filter: blur(40px);
      }
      [data-theme="light"] .smoke-base {
        background: linear-gradient(to top, rgba(197, 160, 89, 0.05) 0%, rgba(197, 160, 89, 0.01) 80%, transparent 100%);
      }

      /* Scrollbar */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 99px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
      
      .light-mode ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); }
      .light-mode ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.2); }

      /* Safe Area Utilities */
      .safe-pb { padding-bottom: env(safe-area-inset-bottom); }
      .safe-pt { padding-top: env(safe-area-inset-top); }

      /* Animation Utilities */
      .animate-enter {
        animation: slideUpFade 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      
      @keyframes slideUpFade {
        from { opacity: 0; transform: translateY(20px) scale(0.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
    </style>
</head>
  <body class="h-screen overflow-hidden text-[15px] leading-relaxed selection:bg-lux-gold selection:text-black">
    <div class="app-background">
      <div class="smoke-base"></div>
      <div class="smoke-cloud smoke-1"></div>
      <div class="smoke-cloud smoke-2"></div>
      <div class="smoke-cloud smoke-3"></div>
      <div class="smoke-cloud smoke-4"></div>
      <div class="smoke-cloud smoke-5"></div>
    </div>
    <div id="root" class="h-full relative z-10"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
