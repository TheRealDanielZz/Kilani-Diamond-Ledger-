
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover" />
    <meta name="theme-color" content="#16171D" />
    
    <!-- FOUC Prevention Script —
         Reads saved preference or falls back to OS prefers-color-scheme.
         Runs synchronously before any paint to prevent flash. -->
    <script>
      (function() {
        var saved = localStorage.getItem('theme_preference');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = (saved === 'light' || saved === 'dark') ? saved : (prefersDark ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
        // Update browser chrome color to match
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'light' ? '#F5F5F7' : '#16171D');
      })();
    </script>
    
    <!-- PWA / iOS Meta -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="KILANI Reporter" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <!-- Icons -->
    <link rel="icon" type="image/jpeg" href="/brand-logo.jpg" />
    <link rel="apple-touch-icon" href="/brand-logo.jpg" />
    
    <link rel="manifest" href="/manifest.json" />

    <title>KILANI Diamond Reporter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    
    <style>
      :root {
        --sat: env(safe-area-inset-top);
        --sab: env(safe-area-inset-bottom);
        --sal: env(safe-area-inset-left);
        --sar: env(safe-area-inset-right);
      }

      html {
        background-color: #0c0d12;
      }

      body {
        -webkit-font-smoothing: antialiased;
        background-color: #0c0d12;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #e4e4e7;
        overflow: hidden; /* Prevent body scroll, handle in root */
        overscroll-behavior-y: none; /* Prevent iOS bounce */
        /* Support safe areas for background color */
        padding-top: var(--sat);
        padding-bottom: var(--sab);
        padding-left: var(--sal);
        padding-right: var(--sar);
      }
      
      .tabular-nums { font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
      
      /* High-performance Clean Atelier Canvas */
      .app-background {
        position: fixed;
        inset: 0;
        z-index: -1;
        background-color: #0A0B0F;
        background: radial-gradient(circle at 85% 15%, rgba(197, 160, 89, 0.04), transparent 45%),
                    radial-gradient(circle at 15% 85%, rgba(59, 130, 246, 0.03), transparent 40%),
                    #0A0B0F;
        pointer-events: none;
        transition: background-color 0.3s ease;
      }

      [data-theme="light"] .app-background {
        background-color: #F0F0F5;
        background: radial-gradient(circle at 85% 15%, rgba(166, 125, 40, 0.05), transparent 45%),
                    radial-gradient(circle at 15% 85%, rgba(100, 100, 160, 0.04), transparent 40%),
                    #F0F0F5;
      }

      /* Scrollbar */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 99px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
      
      .light-mode ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); }
      .light-mode ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.2); }

      /* Safe Area Utilities */
      .safe-pb { padding-bottom: env(safe-area-inset-bottom); }
      .safe-pt { padding-top: env(safe-area-inset-top); }

      /* Animation Utilities */
      .animate-enter {
        animation: slideUpFade 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      
      @keyframes slideUpFade {
        from { opacity: 0; transform: translateY(20px) scale(0.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
    </style>
</head>
  <body class="h-screen overflow-hidden text-[15px] leading-relaxed selection:bg-lux-gold selection:text-black">
    <div class="app-background" aria-hidden="true"></div>
    <div id="root" class="h-full relative z-10"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
